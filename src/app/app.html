@if (gate.required && !gate.unlocked()) {
  <app-passphrase-gate />
} @else {
  <mat-toolbar class="app-toolbar">
    <a class="brand" routerLink="/">
      <mat-icon aria-hidden="true">sports_soccer</mat-icon>
      <span>Table Football Ranked</span>
    </a>

    <span class="toolbar-spacer"></span>

    <nav class="desktop-nav" aria-label="Primary navigation">
      @for (link of navLinks; track link.path) {
        <a mat-button [routerLink]="link.path" routerLinkActive="active">
          <mat-icon aria-hidden="true">{{ link.icon }}</mat-icon>
          {{ link.label }}
        </a>
      }
    </nav>

    <a mat-flat-button color="primary" routerLink="/live" class="record-cta">
      <mat-icon aria-hidden="true">bolt</mat-icon>
      <span class="record-cta-label">Live Match</span>
    </a>

    <button mat-icon-button class="mobile-menu-trigger" [matMenuTriggerFor]="mobileMenu" aria-label="Open navigation menu">
      <mat-icon>menu</mat-icon>
    </button>
    <mat-menu #mobileMenu="matMenu">
      @for (link of navLinks; track link.path) {
        <a mat-menu-item [routerLink]="link.path" routerLinkActive="active">
          <mat-icon aria-hidden="true">{{ link.icon }}</mat-icon>
          <span>{{ link.label }}</span>
        </a>
      }
    </mat-menu>

    @if (gate.required) {
      <button mat-icon-button (click)="gate.lock()" matTooltip="Lock (require the passphrase again)" aria-label="Lock">
        <mat-icon>lock</mat-icon>
      </button>
    }
  </mat-toolbar>

  <main class="app-content">
    <router-outlet />
  </main>
}
